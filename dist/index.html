<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d17">
  <meta name="description" content="Wok, please kasih bocoran tanggal playtest-nya. Kita udah siap main.">
  <title>Kapan playtest-nya, Wok?</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      background: #100d17;
      color: #f8f2ff;
      --lavender: #c7a4ff;
      --muted: #bdb3c9;
      --line: #443650;
      --mono: ui-monospace, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 73% 47%, #2c1945 0%, transparent 56%),
        linear-gradient(#a681cb12 1px, transparent 1px),
        linear-gradient(90deg, #a681cb12 1px, transparent 1px);
      background-size: auto, 44px 44px, 44px 44px;
    }
    .shell {
      width: min(1150px, calc(100% - 80px));
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-block: 24px;
      color: var(--muted);
      font: 0.875rem/1.4 var(--mono);
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    header { border-bottom: 1px solid var(--line); }
    footer { border-top: 1px solid var(--line); }
    .wordmark { color: #f8f2ff; font-weight: bold; }
    .wordmark::before { content: "✦"; color: var(--lavender); margin-right: 10px; }
    .pending { display: flex; align-items: center; gap: 10px; }
    .pending::before {
      content: "";
      flex: 0 0 .55rem;
      height: .55rem;
      border-radius: 50%;
      background: #ffcd83;
      box-shadow: 0 0 14px #ffcd8360;
    }
    main {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      align-items: center;
      gap: clamp(30px, 6vw, 90px);
      padding: 72px 12px 72px 0;
    }
    .salutation {
      margin: 0 0 22px;
      color: var(--lavender);
      font: 700 0.9rem/1.4 var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      font-family: "Arial Black", system-ui, sans-serif;
      font-weight: 950;
      font-size: clamp(3.15rem, 6.8vw, 6.25rem);
      line-height: .94;
      letter-spacing: -.075em;
      margin: 0;
    }
    h1 em { color: var(--lavender); font-style: normal; display: block; }
    .message {
      max-width: 34ch;
      margin: 28px 0 26px;
      color: var(--muted);
      font-size: 1.125rem;
      line-height: 1.6;
    }
    .actions { position: relative; }
    button {
      min-height: 50px;
      border-radius: 7px;
      border: 1px solid transparent;
      padding: 11px 18px;
      background: var(--lavender);
      color: #190d2b;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font: 750 1rem/1.3 system-ui, sans-serif;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    button:hover { background: #e4d0ff; transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:focus-visible, textarea:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }
    .copy-mark {
      width: 12px;
      height: 13px;
      border: 1.5px solid currentColor;
      border-radius: 2px;
      box-shadow: 3px -3px 0 -1.5px var(--lavender), 3px -3px currentColor;
    }
    [role="status"] {
      display: block;
      min-height: 1.5em;
      margin-top: 10px;
      color: var(--lavender);
      font-size: .9rem;
    }
    textarea {
      width: min(100%, 24rem);
      padding: .65rem;
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: inherit;
      background: #1c1229;
      resize: vertical;
    }
    figure {
      margin: 0;
      position: relative;
      transform: rotate(2.5deg);
      padding: 12px 12px 0;
      background: #20162e;
      border: 1px solid #6f568c;
      border-radius: 15px;
      box-shadow: 12px 14px #0d0917, 13px 15px #443650;
    }
    .portrait {
      aspect-ratio: 1.09;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse, #573383, #1a1029 75%);
      border-radius: 8px;
    }
    .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 54%; position: absolute; }
    figcaption {
      padding: 14px 3px;
      color: #e6d7f7;
      font: 0.875rem/1.4 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .sticker {
      position: absolute;
      right: -14px;
      top: 7%;
      transform: rotate(10deg);
      padding: 8px 14px;
      border-radius: 5px;
      background: #ffcd83;
      box-shadow: 3px 4px #100d17;
      color: #241329;
      font: 900 1rem/1.2 var(--mono);
    }
    @media (max-width: 850px) {
      .shell { width: calc(100% - 56px); }
      main { gap: 28px; }
    }
    @media (max-width: 700px) {
      .shell { width: calc(100% - 40px); }
      header, footer { padding-block: 18px; letter-spacing: .025em; }
      main { grid-template-columns: 1fr; gap: 34px; padding: 38px 0 46px; }
      h1 { font-size: clamp(2.5rem, 11vw, 4.85rem); }
      figure { width: min(calc(100% - 22px), 430px); justify-self: center; }
      .salutation { margin-bottom: 15px; }
      .message { margin: 20px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <span class="wordmark">Playtest Club</span>
      <span class="pending">Nunggu jadwal</span>
    </header>
    <main>
      <section aria-labelledby="title">
        <p class="salutation">Permohonan buat Wok</p>
        <h1 id="title">Kapan <em>playtest-nya,</em> Wok?</h1>
        <p class="message">Please, Wok 🥺 Kasih bocoran tanggalnya dong. Kita udah siap main.</p>
        <div class="actions">
          <button type="button" id="copy"><span class="copy-mark" aria-hidden="true"></span>Salin buat Wok</button>
          <span id="status" role="status"></span>
          <textarea id="manual-copy" aria-label="Pesan yang bisa disalin" readonly hidden rows="3"></textarea>
        </div>
      </section>
      <figure>
        <div class="portrait">
          <img src="tester.jpg" width="900" height="900" alt="Kucing oren pakai headset sambil memegang controller">
        </div>
        <figcaption>Tester udah siap 🎮</figcaption>
        <span class="sticker" aria-hidden="true">PLEASE!</span>
      </figure>
    </main>
    <footer><span>Sampai ketemu di playtest, Wok.</span></footer>
  </div>
  <script>
    const message = "Please, Wok 🥺 Kapan playtest-nya? Kasih bocoran tanggalnya dong. Kita udah siap main!";
    const status = document.querySelector("#status");
    const manualCopy = document.querySelector("#manual-copy");

    document.querySelector("#copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(message);
        manualCopy.hidden = true;
        status.textContent = "Pesan disalin. Tinggal kirim ke Wok!";
      } catch {
        status.textContent = "Salin pesan dari kotak di bawah.";
        manualCopy.value = message;
        manualCopy.hidden = false;
        manualCopy.focus();
        manualCopy.select();
      }
    });
  </script>
</body>
</html>
